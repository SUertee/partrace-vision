[versions]
# 构建工具链
agp = "8.11.1"
kotlin = "2.2.21"

# Android SDK
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# UI / Compose
compose-multiplatform = "1.7.1"
activity-compose = "1.8.2"
compose-bom = "2025.01.00"
accompanist = "0.36.0"
coil = "3.0.0-rc01"
voyager = "1.1.0-beta03"
molecule = "1.3.2"
unstyled = "1.30.0"
kermit = "2.0.4"
moko-permission = "0.18.1"
easyqrscan = "0.2.0"
sonner = "0.3.8"

# AndroidX
appcompat = "1.6.1"
annotation = "1.7.1"

# Kotlinx
coroutines = "1.9.0"
kotlinx-serialization = "1.9.0"
kotlinx-datetime = "0.7.1"
kotlinx-atomic = "0.29.0"
okio = "3.16.4"

# Koin
koin = "4.0.0"

# SQLDelight
sqldelight = "2.2.1"

# Network
ktor = "3.3.3"

# SDK 运行时三方依赖（版本对齐 SDK sdkLibs；AAR 内嵌组件在运行期需要这些类库）
uuid = "0.7.1"
aws-iot = "2.81.0"
paho-mqtt = "1.2.5"
cryptography = "0.5.0"
conscrypt = "2.5.3"
zip4j = "2.11.5"
ktorfit = "2.7.1"
napier = "2.7.1"
kotlinx-io = "0.8.0"
kotlinx-collections-immutable = "0.4.0"
datastore = "1.1.1"
room = "2.7.0-alpha08"
okhttp = "4.12.0"
gson = "2.10.1"

# Misc
zxing = "3.4.1"
korge-krypto = "4.0.2"

# Test
junit = "4.13.2"
mockito = "5.11.0"
mockitoKotlin = "5.3.1"
mockk = "1.13.17"
robolectric = "4.16.1"

[libraries]
# AndroidX
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
material3 = { group = "androidx.compose.material3", name = "material3" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

# Compose 三方
coil-core = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil" }
coil-networkOkhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-screenModel = { module = "cafe.adriel.voyager:voyager-screenmodel", version.ref = "voyager" }
voyager-bottomSheetNavigator = { module = "cafe.adriel.voyager:voyager-bottom-sheet-navigator", version.ref = "voyager" }
voyager-tabNavigator = { module = "cafe.adriel.voyager:voyager-tab-navigator", version.ref = "voyager" }
voyager-transitions = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyager" }
voyager-koin = { module = "cafe.adriel.voyager:voyager-koin", version.ref = "voyager" }
molecule-runtime = { module = "app.cash.molecule:molecule-runtime", version.ref = "molecule" }
unstyled = { module = "com.composables:core", version.ref = "unstyled" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
moko-permissions = { group = "dev.icerock.moko", name = "permissions", version.ref = "moko-permission" }
moko-permissionsCompose = { group = "dev.icerock.moko", name = "permissions-compose", version.ref = "moko-permission" }
easyqrscan = { module = "io.github.kalinjul.easyqrscan:scanner", version.ref = "easyqrscan" }
sonner = { module = "io.github.dokar3:sonner", version.ref = "sonner" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-dateTime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-atomic = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomic" }
okio-core = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }

# Network
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-websockets = { module = "io.ktor:ktor-websockets", version.ref = "ktor" }

# SQLDelight（data-center 运行时依赖，公共 Maven）
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-primitive-adapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }

# SDK 运行时三方依赖（AAR 内嵌组件所需；Demo 需在 classpath 提供）
uuid = { module = "com.benasher44:uuid", version.ref = "uuid" }
aws-iot = { module = "com.amazonaws:aws-android-sdk-iot", version.ref = "aws-iot" }
paho-mqtt = { module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3", version.ref = "paho-mqtt" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
cryptography-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
ktorfit-lib = { module = "de.jensklingenberg.ktorfit:ktorfit-lib", version.ref = "ktorfit" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
stately-common = { module = "co.touchlab:stately-common", version = "2.0.5" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastore" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
parcelize-runtime = { module = "org.jetbrains.kotlin:kotlin-parcelize-runtime", version = "2.2.21" }
javax-inject = { module = "javax.inject:javax.inject", version = "1" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Misc
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
korge-krypto = { group = "com.soywiz.korlibs.krypto", name = "krypto", version.ref = "korge-krypto" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
